<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rota terminal</title>
<link rel="stylesheet" href="/assets/page.css?v={{v}}">
<link rel="stylesheet" href="/assets/term/term.css?v={{v}}">
<link rel="stylesheet" href="/assets/term/list.css?v={{v}}">
<link rel="stylesheet" href="/assets/term/info.css?v={{v}}">
<link rel="stylesheet" href="/assets/term/size.css?v={{v}}">
<link rel="stylesheet" href="/assets/term/dock.css?v={{v}}">

<a class="skip" href="#tscreen">Skip to the terminal</a>

<header id="top" class="top"></header>

<div id="termshell" class="shell term" hidden>
  <section class="pane termlist" aria-label="Terminals">
    <div id="tlist" class="pane-body"></div>
  </section>
  <main class="pane">
    <div id="tstrip" class="termstrip" role="status" aria-live="polite"></div>
    <div id="tscreen" class="termscreen"></div>
    <div id="tdock" class="termdock" hidden></div>
  </main>
  <aside class="pane out terminfo" aria-label="About this terminal">
    <div id="tinfo" class="pane-body"></div>
  </aside>
</div>

<main id="gate" class="gate"></main>
