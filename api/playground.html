<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rota playground</title>
<link rel="stylesheet" href="/assets/page.css">

<a class="skip" href="#main">Skip to content</a>

<header id="top" class="top"></header>

<div class="shell">
  <nav id="nav" class="rail" aria-label="Sections"></nav>
  <main id="main" class="pane">
    <div id="panel" class="pane-body"></div>
    <div id="foot" class="pane-foot"></div>
  </main>
  <aside class="pane out" aria-label="Output">
    <nav id="ionav" class="tabs"></nav>
    <div id="io" class="pane-body"></div>
    <div id="talk"></div>
  </aside>
</div>

<script src="/assets/page.js"></script>
<script>
"use strict";

// colorJSON paints a JSON document without a parser: it walks the token
// shapes JSON.stringify produces, which is all that is ever shown here.
function colorJSON(value) {
  let text = typeof value === "string" ? value : JSON.stringify(value, null, 2);
  try { if (typeof value === "string") text = JSON.stringify(JSON.parse(value), null, 2); } catch {}
  return esc(text).replace(
    /("(\\.|[^"\\])*")(\s*:)?|\b(true|false)\b|\bnull\b|-?\d+(\.\d+)?([eE][+-]?\d+)?/g,
    (m, str, _e, colon) => {
      if (str) return colon ? `<span class="j-key">${str}</span><span class="j-punc">:</span>` : `<span class="j-str">${str}</span>`;
      if (m === "true" || m === "false") return `<span class="j-bool">${m}</span>`;
      if (m === "null") return `<span class="j-null">${m}</span>`;
      return `<span class="j-num">${m}</span>`;
    });
}
const codeBlock = v => el("pre", { class: "code", html: colorJSON(v) });
const ms = n => (n >= 1000 ? (n / 1000).toFixed(1) + "s" : n + "ms");

/* ================================================================ state == */
let view = "ask";                // which rail section is showing
let ioTab = "response";          // which output tab is showing
let filter = "";                 // narrows the field list
let open = new Set(["core"]);    // which field groups are expanded
let values = {};                 // the request, by field name
let uploads = [];                // {path, content} pending files
let fieldsHost = null;           // the part of Ask the filter redraws
let lastResponse = null, lastEvents = [], lastAnswer = "", streaming = false;
// live is the run open on a socket right now, if there is one: its connection,
// where its stream got to, and whether it has ended. Null means there is
// nothing to talk to, and the box under the output pane is not there.
let live = null;
// selected is a run from history being read in the output panes instead of
// the live request. Null means "show what is about to be sent".
let selected = null;

const HIST_KEY = "rota.history";
const loadHistory = () => { try { return JSON.parse(localStorage.getItem(HIST_KEY)) || []; } catch { return []; } };

// saveHistory keeps as much as the browser will hold. A single run with a
// large response must not cost the whole history, so a quota refusal drops
// the oldest half and tries again rather than losing everything.
function saveHistory(h) {
  let list = h.slice(0, 40);
  for (;;) {
    try { localStorage.setItem(HIST_KEY, JSON.stringify(list)); return; }
    catch {
      if (list.length <= 1) { try { localStorage.removeItem(HIST_KEY); } catch {} return; }
      list = list.slice(0, Math.floor(list.length / 2));
    }
  }
}

// slim is a response small enough to keep. The event log is the bulky part
// and a count says as much as replaying it would.
function slim(doc) {
  if (!doc || typeof doc !== "object") return doc;
  const copy = Object.assign({}, doc);
  if (Array.isArray(copy.events)) { copy.events = undefined; delete copy.events; }
  return copy;
}

// setRotation writes one account's place in the queue, or the usage at which
// the queue moves past it.
async function setRotation(id, patch) {
  setState("saving…", "busy");
  const r = await api("PATCH", "/v1/accounts/" + id, patch);
  showResponse(r.doc, r.status);
  setState(r.ok ? "saved" : "failed " + r.status, r.ok ? "ok" : "bad");
  return r.ok;
}

/* ============================================================ navigation == */
const VIEWS = [
  ["ask", "Ask", "1"],
  ["accounts", "Accounts", "2"],
  ["running", "Running", "3"],
  ["signin", "Sign in", "4"],
  ["console", "Console", "5"],
];
function renderNav() {
  $("#nav").replaceChildren(...VIEWS.map(([id, label, key]) =>
    el("button", {
      "aria-current": id === view ? "page" : null,
      onclick: () => { view = id; renderNav(); render(); },
    }, [el("span", { text: label }), el("span", { class: "k", text: key })])));
}

const IO_TABS = [["response", "Response"], ["request", "Request"], ["history", "History"]];
function renderIONav() {
  $("#ionav").replaceChildren(...IO_TABS.map(([id, label]) => {
    const b = el("button", { text: label, role: "tab", "aria-selected": String(id === ioTab),
      onclick: () => { ioTab = id; renderIONav(); renderIO(); } });
    if (id === "history") { const n = loadHistory().length; if (n) b.append(el("span", { class: "count", text: n })); }
    return b;
  }));
}

/* ======================================================== the field model == */
const account = () => accounts.find(a => String(a.id) === String(values.__account));

// providerFields is the vocabulary for whoever will answer. With an account
// named that is the account's provider; with the rotation chosen it is the
// provider-neutral set, because which CLI answers is not settled until it
// does — and a model belonging to one provider would be refused by another.
const providerFields = () => {
  const a = account();
  const p = a && schema.providers[a.provider];
  return (p && p.fields) || schema.fields || [];
};

const GROUPS = [
  ["core", "Essentials", "What most requests set"],
  ["session", "Session", "Continuing, forking and naming conversations"],
  ["context", "Context", "Where it runs, and what it may read"],
  ["permissions", "Permissions", "What it may do without asking"],
  ["stream", "Output", "What comes back, and how much"],
];

function setValue(name, v) {
  if (v === "" || v === undefined || v === null || (Array.isArray(v) && !v.length)) delete values[name];
  else values[name] = v;
  if (ioTab === "request") renderIO();
  renderFoot();
}

// buildBody turns the form into the exact JSON the server will receive.
// Keys starting with __ are the page's own bookkeeping and never sent.
function buildBody() {
  const body = {};
  for (const [k, v] of Object.entries(values)) if (!k.startsWith("__")) body[k] = v;
  if (uploads.length) body.files = uploads;
  // The page shows the answer split at fences and offers a question's
  // options as buttons, so it asks for both readings; a reply carries
  // neither unless asked.
  body.with = ["blocks", "ask"];
  return body;
}

// matches decides whether a field survives the filter box: its name, label
// and help are all searched, so "directory" finds add_dirs.
const matches = f => {
  if (!filter) return true;
  const q = filter.toLowerCase();
  return (f.name + " " + (f.label || "") + " " + (f.help || "")).toLowerCase().includes(q);
};

/* ====================================================== field rendering === */
function helpNode(f) { return f.help ? el("p", { class: "help", text: f.help }) : null; }

// lockNote says why this server will not take a field, or nothing when it
// will. The page offers only what the server it is talking to can actually
// do, and it learns both of these the same way — from /v1/schema.
function lockNote(f) {
  if (!schema) return "";
  if ((f.dangerous || []).length && !schema.allow_dangerous) return "the server was started without --allow-dangerous";
  // A run that stays open is carried on a WebSocket, so a server with those
  // routes off has nothing to hold one with.
  if (f.name === "input" && schema.websocket === false) return "this server answers no WebSocket routes";
  return "";
}

function renderField(f) {
  const dangerous = (f.dangerous || []).length > 0;
  const note = lockNote(f), locked = !!note;
  const id = "f_" + f.name;

  if (f.kind === "bool") {
    const input = el("input", { type: "checkbox", id, checked: !!values[f.name], disabled: locked,
      onchange: e => setValue(f.name, e.target.checked || "") });
    return el("div", { class: "toggle" + (dangerous ? " danger" : "") + (locked ? " locked" : "") }, [
      el("span", { class: "switch" }, [input, el("i", {})]),
      el("label", { class: "t-text", for: id }, [
        el("b", { text: f.label || f.name }),
        f.help ? el("span", { text: f.help }) : null,
        locked ? el("div", { class: "danger-note", text: note }) : null,
      ]),
    ]);
  }

  const label = el("label", { class: "flabel", for: id }, [
    el("span", { text: f.label || f.name }),
    el("span", { class: "name", text: f.name }),
  ]);
  let control;
  switch (f.kind) {
    case "enum": {
      control = el("select", { class: "ctl", id, disabled: locked,
        onchange: e => setValue(f.name, e.target.value) });
      control.append(el("option", { value: "", text: f.default ? `default (${f.default})` : "— not set —" }));
      for (const v of f.enum || []) {
        control.append(el("option", { value: v, text: v, selected: values[f.name] === v }));
      }
      break;
    }
    case "text":
      control = el("textarea", { class: "ctl", id, rows: f.name === "prompt" ? 6 : 4, spellcheck: "false",
        placeholder: f.placeholder || "", oninput: e => setValue(f.name, e.target.value) });
      control.value = values[f.name] || "";
      break;
    case "number":
      control = el("input", { class: "ctl", id, type: "number", placeholder: f.placeholder || "",
        oninput: e => setValue(f.name, e.target.value === "" ? "" : Number(e.target.value)) });
      control.value = values[f.name] ?? "";
      break;
    case "list":
      control = chipsInput(f);
      break;
    case "map":
      control = mapInput(f);
      break;
    case "json":
      control = jsonEditor(f);
      break;
    case "files":
      control = filesInput();
      break;
    default:
      control = el("input", { class: "ctl", id, type: "text", placeholder: f.placeholder || "", disabled: locked,
        oninput: e => setValue(f.name, e.target.value) });
      control.value = values[f.name] || "";
  }
  return el("div", { class: "field" + (dangerous ? " danger" : "") + (locked ? " locked" : "") }, [
    label, helpNode(f), control,
    locked ? el("div", { class: "danger-note", text: note }) : null,
  ]);
}

function chipsInput(f) {
  const box = el("div", { class: "chips" });
  const input = el("input", { placeholder: f.placeholder || "type and press Enter" });
  const draw = () => {
    box.replaceChildren(...(values[f.name] || []).map((v, i) =>
      el("span", { class: "chip" }, [el("span", { text: v }),
        el("button", { type: "button", text: "×", title: "remove", onclick: () => {
          const next = (values[f.name] || []).slice(); next.splice(i, 1);
          setValue(f.name, next); draw();
        } })])), input);
  };
  const add = raw => {
    const parts = raw.split(",").map(s => s.trim()).filter(Boolean);
    if (!parts.length) return;
    setValue(f.name, (values[f.name] || []).concat(parts));
    input.value = ""; draw(); input.focus();
  };
  input.addEventListener("keydown", e => {
    if (e.key === "Enter") { e.preventDefault(); add(input.value); }
    else if (e.key === "Backspace" && !input.value && (values[f.name] || []).length) {
      const next = values[f.name].slice(); next.pop(); setValue(f.name, next); draw(); input.focus();
    }
  });
  input.addEventListener("blur", () => add(input.value));
  draw();
  return box;
}

function mapInput(f) {
  const box = el("div");
  const draw = () => {
    const entries = Object.entries(values[f.name] || {});
    box.replaceChildren(...entries.map(([k, v], i) => el("div", { class: "kv" }, [
      el("input", { class: "ctl", value: k, placeholder: "key", onchange: e => {
        const next = {}; entries.forEach(([kk, vv], j) => { next[j === i ? e.target.value : kk] = vv; });
        setValue(f.name, next); draw();
      } }),
      el("input", { class: "ctl", value: v, placeholder: "value", oninput: e => {
        const next = Object.fromEntries(entries); next[k] = e.target.value; setValue(f.name, next);
      } }),
      el("button", { class: "btn", type: "button", text: "×", onclick: () => {
        const next = Object.fromEntries(entries.filter((_, j) => j !== i)); setValue(f.name, next); draw();
      } }),
    ])), el("button", { class: "btn tiny", type: "button", text: "+ add pair", onclick: () => {
      const next = Object.assign({}, values[f.name] || {}); next[""] = ""; setValue(f.name, next); draw();
    } }));
  };
  draw();
  return box;
}

/* --------------------------------------------------- JSON / schema editor */
const SCHEMA_TYPES = ["string", "number", "integer", "boolean", "array", "object"];

// jsonEditor edits a JSON value two ways: a builder for the common
// object-with-properties shape, and the raw document for everything else.
// The builder is what makes a JSON Schema quick to write; the raw view is
// what keeps every other schema possible.
function jsonEditor(f) {
  const isSchema = f.name.endsWith("schema");
  let mode = isSchema ? "build" : "raw";
  const host = el("div", { class: "json-ed" });

  const status = el("div", { class: "json-status", text: "" });
  const area = el("textarea", { spellcheck: "false", placeholder: f.placeholder || "{ }" });
  area.value = values[f.name] ? JSON.stringify(values[f.name], null, 2) : "";

  const validate = () => {
    const raw = area.value.trim();
    if (!raw) { setValue(f.name, ""); status.className = "json-status"; status.textContent = ""; return; }
    try {
      setValue(f.name, JSON.parse(raw));
      status.className = "json-status ok"; status.textContent = "valid JSON";
    } catch (e) {
      status.className = "json-status bad"; status.textContent = e.message;
    }
  };
  area.addEventListener("input", validate);
  area.addEventListener("keydown", e => {
    if (e.key === "Tab") {
      e.preventDefault();
      const s = area.selectionStart;
      area.setRangeText("  ", s, area.selectionEnd, "end");
      validate();
    }
  });

  const builder = el("div", { style: "padding:10px 11px" });
  const drawBuilder = () => {
    const doc = values[f.name] && typeof values[f.name] === "object" ? values[f.name] : { type: "object", properties: {}, required: [] };
    const props = doc.properties || {};
    const required = new Set(doc.required || []);
    const commit = () => {
      const out = { type: "object", properties: props, required: [...required].filter(k => k in props) };
      if (!out.required.length) delete out.required;
      setValue(f.name, out);
      area.value = JSON.stringify(out, null, 2);
      status.className = "json-status ok"; status.textContent = "valid JSON";
      drawBuilder();
    };
    const rows = Object.entries(props).map(([name, spec]) => el("div", { class: "sb-row" }, [
      el("input", { class: "ctl", value: name, placeholder: "field name", onchange: e => {
        const v = props[name]; delete props[name]; props[e.target.value || "field"] = v;
        if (required.delete(name)) required.add(e.target.value || "field");
        commit();
      } }),
      (() => {
        const s = el("select", { class: "ctl", onchange: e => { props[name] = Object.assign({}, props[name], { type: e.target.value }); commit(); } });
        for (const t of SCHEMA_TYPES) s.append(el("option", { value: t, text: t, selected: (spec || {}).type === t }));
        return s;
      })(),
      el("label", { class: "sb-req" }, [
        el("input", { type: "checkbox", checked: required.has(name),
          onchange: e => { e.target.checked ? required.add(name) : required.delete(name); commit(); } }),
        el("span", { text: "required" }),
      ]),
      el("button", { class: "btn tiny", type: "button", text: "×", title: "remove",
        onclick: () => { delete props[name]; required.delete(name); commit(); } }),
    ]));
    builder.replaceChildren(
      ...(rows.length ? rows : [el("p", { class: "help", text: "No fields yet. Add one to shape the answer." })]),
      el("button", { class: "btn tiny", type: "button", text: "+ add field", onclick: () => {
        let n = "field", i = 1;
        while (n in props) n = "field" + ++i;
        props[n] = { type: "string" }; commit();
      } }),
    );
  };

  const modeBtns = el("header");
  const setMode = m => {
    mode = m;
    builder.style.display = m === "build" ? "" : "none";
    area.style.display = m === "raw" ? "" : "none";
    for (const b of modeBtns.querySelectorAll("[data-mode]")) b.classList.toggle("primary", b.dataset.mode === m);
    if (m === "build") drawBuilder();
  };
  if (isSchema) {
    modeBtns.append(
      el("button", { class: "btn tiny", type: "button", "data-mode": "build", text: "Builder", onclick: () => setMode("build") }),
      el("button", { class: "btn tiny", type: "button", "data-mode": "raw", text: "JSON", onclick: () => setMode("raw") }),
    );
  }
  modeBtns.append(
    el("span", { class: "grow" }),
    el("button", { class: "btn tiny", type: "button", text: "Format", onclick: () => {
      try { area.value = JSON.stringify(JSON.parse(area.value), null, 2); } catch {}
      validate();
    } }),
    el("button", { class: "btn tiny", type: "button", text: "Clear",
      onclick: () => { area.value = ""; validate(); if (mode === "build") drawBuilder(); } }),
  );

  host.append(modeBtns, builder, area, status);
  setMode(mode);
  validate();
  return host;
}

function filesInput() {
  const box = el("div");
  const list = el("div", { class: "filelist" });
  const drop = el("div", { class: "drop", text: "Drop files here, or click to choose" });
  const picker = el("input", { type: "file", multiple: true, class: "sr" });
  const draw = () => {
    list.replaceChildren(...uploads.map((u, i) => el("div", { class: "filerow" }, [
      el("code", { text: u.path }),
      el("span", { class: "pill", text: Math.ceil((u.content.length * 3) / 4 / 1024) + " KB" }),
      el("button", { class: "btn tiny", type: "button", text: "×",
        onclick: () => { uploads.splice(i, 1); draw(); setValue("__files", uploads.length || ""); } }),
    ])));
  };
  const take = files => {
    for (const file of files) {
      const reader = new FileReader();
      reader.onload = () => {
        uploads.push({ path: file.name, content: String(reader.result).split(",")[1] || "" });
        draw(); setValue("__files", uploads.length);
      };
      reader.readAsDataURL(file);
    }
  };
  drop.addEventListener("click", () => picker.click());
  drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("over"); take(e.dataTransfer.files); });
  picker.addEventListener("change", () => take(picker.files));
  box.append(drop, picker, list);
  draw();
  return box;
}

/* ============================================================ view: Ask == */
// groupCount is how many values a collapsed group is hiding, so nothing set
// is ever invisible.
function groupCount(g) {
  const names = providerFields().filter(f => f.group === g).map(f => f.name);
  let n = names.filter(name => values[name] !== undefined && name !== "prompt").length;
  if (g === "context" && uploads.length) n++;
  return n;
}

function viewAsk(panel) {
  if (!accounts.length) {
    panel.append(el("div", { class: "empty" }, [
      el("b", { text: "No accounts yet" }),
      el("span", { text: "Open Sign in to add one." }),
    ]));
    return;
  }
  // "" means "let the rotation choose", which is what a run posted to
  // /v1/run does. It is the first option because it is the usual one.
  if (values.__account === undefined) values.__account = defaultAccount ? "" : String(accounts[0].id);

  const next = accounts.find(x => x.id === defaultAccount);
  const pick = el("select", { class: "ctl", id: "account", onchange: e => { values.__account = e.target.value; render(); } });
  pick.append(el("option", { value: "", selected: values.__account === "",
    text: next ? `Rotation — next is #${next.id} ${next.provider}` : "Rotation — nothing available" }));
  for (const a of accounts) {
    pick.append(el("option", { value: a.id, selected: String(a.id) === values.__account, disabled: a.status === "reauth",
      text: `#${a.id}  ${a.provider}  ·  ${a.email || a.uuid || "account"}` +
        (a.order ? `  ·  ${a.order} in rotation` : "  ·  out of rotation") +
        (a.status === "ok" ? "" : `  (${a.status})`) }));
  }
  const a = account();
  const p = a && schema.providers[a.provider];
  panel.append(
    el("label", { class: "flabel", for: "account", text: "Account" }),
    el("p", { class: "help", text: a
      ? `${(p && (p.models || []).length) || 0} models · default ${(p && p.defaults.model) || "chosen by the CLI"}${p && p.defaults.effort ? " · effort " + p.defaults.effort : ""}`
      : "Leave this on Rotation and rota takes the first account still under its threshold. Arrange that queue under Accounts." }),
    el("div", { class: "target" }, [pick]),
  );

  // The filter is the answer to a vocabulary this large: nothing is hidden
  // behind a tab, and anything can be found by name, label or description.
  // It lives outside the redrawn region, so typing into it never destroys
  // the box being typed into.
  const box = el("input", { type: "search", placeholder: "Filter fields…", "aria-label": "Filter fields" });
  box.value = filter;
  box.addEventListener("input", e => { filter = e.target.value; drawFields(); });
  panel.append(el("div", { class: "filter" }, [
    box,
    el("button", { class: "x", title: "clear the filter", "aria-label": "clear the filter", text: "×",
      onclick: () => { filter = ""; box.value = ""; drawFields(); } }),
  ]));

  fieldsHost = el("div");
  panel.append(fieldsHost);
  drawFields();
}

// drawFields redraws the grouped field list, and only that. Every group's
// body is rendered whether it is open or not, and openness is a class: the
// header button then survives being toggled, which is what keeps keyboard
// focus where the person put it.
function drawFields() {
  const host = fieldsHost;
  if (!host) return;
  host.replaceChildren();
  const all = providerFields();
  let shown = 0;
  for (const [g, title, sub] of GROUPS) {
    const fields = all.filter(f => f.group === g && matches(f));
    if (!fields.length) continue;
    shown += fields.length;
    // A filter that matched here opens the group: hiding a hit behind a
    // collapsed header would make the search look broken.
    const isOpen = !!filter || open.has(g);
    const n = groupCount(g);
    const head = el("button", { class: "head", "aria-expanded": String(isOpen) }, [
      el("span", { text: title }),
      el("span", { class: "sub", text: sub }),
      n ? el("span", { class: "count", text: n }) : null,
      el("span", { class: "chev", text: "›" }),
    ]);
    const section = el("section", { class: "group" + (isOpen ? " open" : "") }, [
      head, el("div", { class: "body" }, fields.map(renderField)),
    ]);
    head.addEventListener("click", () => {
      const now = !section.classList.contains("open");
      section.classList.toggle("open", now);
      head.setAttribute("aria-expanded", String(now));
      if (now) open.add(g); else open.delete(g);
    });
    host.append(section);
  }
  if (!shown) {
    host.append(el("div", { class: "empty" }, [
      el("b", { text: "Nothing matches" }),
      el("span", { text: `No field mentions “${filter}”.` }),
    ]));
  }
}

/* ======================================================= view: Accounts == */
// viewAccounts is the rotation itself, in the order it is spent. The order
// and the threshold are the two numbers that decide that, so they are
// editable here rather than merely displayed.
// viewRunning shows what the CLIs are doing: the ones open right now, and the
// conversations that could be picked up again.
//
// It is asked for when the section is opened rather than kept current.
// Answering means reading directories that belong to other programs, and none
// of it changes fast enough to be worth polling; Refresh asks again.
function viewRunning(panel) {
  const host = el("div");
  const fill = doc => {
    const instances = (doc && doc.instances) || [];
    const sessions = (doc && doc.sessions) || [];
    const kids = [el("button", { class: "btn tiny", text: "Refresh", onclick: () => draw() })];

    const running = [el("h4", { text: "Running now" })];
    if (!instances.length) {
      running.push(el("p", { class: "help", text: "No vendor CLI or editor has anything open." }));
    } else {
      const t = el("table", {}, [el("tr", {}, ["what", "account", "directory", "session", "pid"]
        .map(h => el("th", { text: h, scope: "col" })))]);
      for (const i of instances) {
        t.append(el("tr", {}, [
          el("td", { text: i.kind === "cli" ? (i.provider || "cli") : i.kind }),
          el("td", { text: i.account ? "#" + i.account + " " + (i.label || "") : "—" }),
          el("td", { text: i.dir || "—" }),
          el("td", { text: i.session ? i.session.slice(0, 8) : "—" }),
          el("td", { text: i.pid ? String(i.pid) : "" }),
        ]));
      }
      running.push(t);
    }
    kids.push(el("div", { class: "sect" }, running));

    const resume = [el("h4", { text: "Could be resumed" })];
    if (!sessions.length) {
      resume.push(el("p", { class: "help", text: "No conversation rota can read." }));
    } else {
      const t = el("table", {}, [el("tr", {}, ["account", "provider", "session", "name", "directory", ""]
        .map(h => el("th", { text: h, scope: "col" })))]);
      for (const x of sessions) {
        // The whole id, not the eight characters shown: --resume takes all of
        // it, and a button that copied a prefix would be worse than none.
        const copy = el("button", { class: "btn tiny", text: "Copy id", title: x.id || "",
          onclick: () => { try { navigator.clipboard.writeText(x.id); } catch {} } });
        t.append(el("tr", {}, [
          el("td", { text: x.account ? "#" + x.account + " " + (x.label || "") : "shared" }),
          el("td", { text: x.provider || "" }),
          el("td", { text: (x.id || "").slice(0, 8) }),
          el("td", { text: x.name || "—", title: x.name || "" }),
          el("td", { text: x.dir || "—" }),
          el("td", {}, [copy]),
        ]));
      }
      resume.push(t);
    }
    kids.push(el("div", { class: "sect" }, resume));

    if (doc && doc.shared) {
      kids.push(el("p", { class: "help", text:
        doc.shared.dir + " holds " + doc.shared.sessions + " conversations across " +
        doc.shared.projects + " projects, shared by every account with no project of its own, " +
        "so none of them belongs to one account." }));
    }
    for (const n of (doc && doc.notes) || []) {
      kids.push(el("p", { class: "help", text: n }));
    }
    host.replaceChildren(...kids);
  };

  const draw = async () => {
    setState("loading…", "busy");
    const r = await api("GET", "/v1/accounts?sessions=1");
    setState(r.ok ? "connected" : "failed", r.ok ? "ok" : "bad");
    showResponse(r.doc, r.status);
    fill(r.ok ? r.doc : {});
  };

  fill({});
  panel.append(host);
  draw();
}

function viewAccounts(panel) {
  const table = el("table");
  const draw = async force => {
    setState(force ? "refreshing…" : "loading…", "busy");
    const r = await refreshAccounts(force);
    setState(r.ok ? "connected" : "failed", r.ok ? "ok" : "bad");
    showResponse(r.doc, r.status);
    fill();
  };
  const write = async (id, patch) => { if (await setRotation(id, patch)) await draw(false); else fill(); };
  const remove = async a => {
    if (!confirm(`Remove account #${a.id} (${a.email || a.provider})?\n\nIts staged credentials are deleted with it.`)) return;
    const r = await api("DELETE", "/v1/accounts/" + a.id);
    showResponse(r.doc, r.status);
    setState(r.ok ? "removed" : "failed " + r.status, r.ok ? "ok" : "bad");
    await draw(false);
  };

  const fill = () => {
    const queue = accounts.filter(x => x.order > 0);
    table.replaceChildren(el("tr", {}, ["order", "id", "provider", "account", "project", "usage", "moves on at", "checked", "status", ""]
      .map(h => el("th", { text: h, scope: "col" }))));
    for (const a of accounts) {
      const at = queue.indexOf(a);
      // The server does the shifting: an arrow says where the account goes
      // and the neighbour moves with it, in one write.
      const order = el("td", {}, [el("div", { class: "ordercell" }, [
        el("button", { class: "mv", text: "▲", title: "one place earlier in the rotation", "aria-label": "move earlier",
          disabled: at <= 0, onclick: () => write(a.id, { order: "up" }) }),
        el("button", { class: "mv", text: "▼", title: "one place later in the rotation", "aria-label": "move later",
          disabled: at < 0 || at >= queue.length - 1, onclick: () => write(a.id, { order: "down" }) }),
        el("input", { class: "num", type: "number", min: "0", value: String(a.order),
          "aria-label": "place in the rotation",
          title: "1 is tried first; the accounts after it move down one. 0 keeps this account out of the rotation",
          onchange: e => write(a.id, { order: Math.max(0, Number(e.target.value) | 0) }) }),
      ])]);

      const usage = el("td");
      for (const w of a.windows || []) {
        usage.append(el("div", { style: "margin-bottom:5px" }, [
          el("div", { style: "font-size:12px", text: `${w.name} ${Math.round(w.percent)}%${w.resetIn ? " · resets in " + w.resetIn : ""}` }),
          el("div", { class: "bar" }, [el("i", { class: w.percent >= a.threshold ? "hot" : "", style: `width:${Math.min(100, w.percent)}%` })]),
        ]));
      }
      if (!(a.windows || []).length) {
        usage.append(el("span", { class: "help", style: "margin:0", text: a.metered ? "not read yet" : "no usage endpoint" }));
      }

      const status = el("td", {}, [el("span", { class: "pill " + (a.status === "ok" ? "ok" : "bad"), text: a.status })]);
      if (a.id === defaultAccount) status.append(el("span", { class: "badge", style: "margin-left:6px", text: "next" }));

      table.append(el("tr", { class: a.order === 0 ? "out" : (a.id === defaultAccount ? "next" : "") }, [
        order,
        el("td", { text: "#" + a.id }),
        el("td", { text: a.provider }),
        el("td", { text: a.email || a.uuid || "" }),
        el("td", {}, [
          el("input", { class: "ctl pathin", value: a.cwd || "", placeholder: "runs anywhere",
            "aria-label": "working directory for this account",
            title: "runs on this account start here when the request names no directory",
            onchange: e => write(a.id, { cwd: e.target.value.trim() }) }),
          el("input", { class: "ctl pathin", style: "margin-top:4px", value: a.config_dir || "", placeholder: "default config",
            "aria-label": "configuration directory for this account",
            title: "this account's own memory, skills and staged credentials — must not be the project directory",
            onchange: e => write(a.id, { config_dir: e.target.value.trim() }) }),
          el("input", { class: "ctl pathin", style: "margin-top:4px", value: a.sessions || "", placeholder: "shared | own | dir",
            "aria-label": "where this account's conversations live",
            title: "shared reads your own Claude Code conversations, own keeps this account's to itself, a directory puts them there",
            onchange: e => write(a.id, { sessions: e.target.value.trim() }) }),
        ]),
        usage,
        el("td", {}, [el("input", { class: "num", type: "number", min: "1", max: "100", value: String(a.threshold),
          "aria-label": "usage at which the rotation moves on", disabled: !a.metered,
          title: a.metered ? "the rotation moves on once this account is this much used"
                           : "this provider publishes no usage, so there is nothing to threshold",
          onchange: e => write(a.id, { threshold: Math.max(1, Math.min(100, Number(e.target.value) | 0)) }) })]),
        el("td", { text: a.metered ? (a.checkedAgo || "never") : "n/a" }),
        status,
        el("td", {}, [el("button", { class: "btn tiny ghost", text: "Remove", onclick: () => remove(a) })]),
      ]));
    }
    // Every one of those writes; a watcher sees the numbers and moves none.
    lock(table);
  };

  panel.append(
    el("p", { class: "help", text: "A run that names no account goes down this list from the top and takes the first one still under its threshold. The queue is a list: giving an account a place moves the ones after it down, and the numbers always read 1, 2, 3. Order 0 keeps an account out of the queue without removing it — it can still be run by id." }),
    el("p", { class: "help", text: "Project is where an account belongs: the directory its runs start in, and the directory holding its own memory, skills and credentials. Both must be absolute paths, and they must not be the same one — a credential file does not belong in a repository." }),
    table,
    el("p", { class: "help", style: "margin-top:12px", text: "Quota readings are cached for five minutes; a running server also refreshes them on its own. Refreshing here asks the provider now." }),
  );
  $("#foot").replaceChildren(el("button", { class: "btn primary", text: "Refresh limits", onclick: () => draw(true) }));
  draw(false);
}

/* ========================================================= view: Sign in == */
function viewSignIn(panel) {
  const provider = el("select", { class: "ctl", id: "provider" });
  for (const [name, p] of Object.entries(schema.providers || {})) {
    if (p.hidden) continue;
    provider.append(el("option", { value: name, text: name }));
  }
  const idIn = el("input", { class: "ctl", id: "loginid", placeholder: "login id" });
  const codeIn = el("input", { class: "ctl", id: "logincode", placeholder: "code, key, or the whole redirect URL" });
  const hint = el("p", { class: "help", text: "" });

  panel.append(
    el("section", { class: "step" }, [
      el("h3", {}, [el("i", { text: "1" }), el("span", { text: "Start a login" })]),
      el("p", { class: "help", text: "Opens the provider's approval page in a new tab. For a second account of the same provider use a private window, or the browser will reuse the session you are already signed into." }),
      provider,
      el("div", { style: "margin-top:9px" }, [el("button", { class: "btn", text: "Start login", onclick: async () => {
        const r = await api("POST", "/v1/login", { provider: provider.value });
        showResponse(r.doc, r.status);
        setState(r.ok ? "login started" : "failed", r.ok ? "ok" : "bad");
        if (!r.ok) return;
        idIn.value = r.doc.id;
        hint.textContent = r.doc.delegated
          ? "This provider can also register an account with no credential at all: leave the code empty, and rota prints one command that signs it in itself."
          : "";
        if (r.doc.url) window.open(r.doc.url, "_blank", "noopener");
      } })]),
    ]),
    el("section", { class: "step" }, [
      el("h3", {}, [el("i", { text: "2" }), el("span", { text: "Finish it" })]),
      el("p", { class: "help", text: "Paste what the page gave you — a code, an API key, or the whole redirect URL. A device login needs no code at all: approve in the browser, then press finish." }),
      hint,
      idIn, el("div", { style: "height:8px" }), codeIn,
      el("div", { style: "margin-top:9px" }, [el("button", { class: "btn primary", text: "Finish login", onclick: async () => {
        const r = await api("POST", "/v1/login/" + encodeURIComponent(idIn.value.trim()), { code: codeIn.value.trim() });
        showResponse(r.doc, r.status);
        setState(r.ok ? (r.doc.status || "ok") : "failed", r.ok ? "ok" : "bad");
        if (r.ok && r.doc.loginCommand) {
          hint.textContent = "Account added. rota holds no credential for it — run this once: " + r.doc.loginCommand;
        }
        await refreshAccounts(false);
      } })]),
    ]),
  );
  // Signing an account in is a change like any other.
  lock(panel);
}

  for (const m of ["GET", "POST", "PATCH", "DELETE"]) method.append(el("option", { value: m, text: m }));

  panel.append(
    el("p", { class: "help", text: "Every endpoint is reachable here, including any the other sections do not cover." }),
    el("div", { class: "row2" }, [
      el("div", { class: "field" }, [el("label", { class: "flabel", for: "method", text: "Method" }), method]),
      el("div", { class: "field" }, [el("label", { class: "flabel", for: "path", text: "Path" }), path]),
    ]),
    el("div", { class: "field" }, [el("label", { class: "flabel", for: "rawbody", text: "Body" }), body]),

}

/* ============================================================== running == */
// runPath is where a run is posted: at an account when one is named, at the
// rotation when none is.
const runPath = id => (id ? `/v1/accounts/${id}/run` : "/v1/run");

async function doRun() {
  const body = buildBody();
  if (!body.prompt) {
    open.add("core"); filter = ""; renderPanel();
    setState("a prompt is required", "bad");
    return;
  }
  const id = values.__account;
  const btn = $("#foot .primary");
  if (btn) btn.disabled = true;
  selected = null; // a new run is what the panes should be showing now
  ioTab = "response"; renderIONav();
  const started = Date.now();
  lastEvents = []; lastResponse = null; lastAnswer = ""; streaming = !!body.stream;
  try {
    // A run that takes more messages is opened over a socket instead: the
    // same events come out of it, and what is typed back goes in the same
    // way. Every other run is the fetch it always was.
    if (body.stream && body.input && schema.websocket !== false) await runSocket(id, body, started);
    else if (body.stream) await runStream(id, body, started);
    else {
      const r = await api("POST", runPath(id), body);
      lastResponse = { status: r.status, ok: r.ok, doc: r.doc };
      // The rotation's choice is only known once it has answered.
      remember({ account: (r.doc && r.doc.account) || id, endpoint: runPath(id),
        ok: r.ok, status: r.status, took: Date.now() - started, body, doc: r.doc });
      setState(r.ok ? "done" : "failed " + r.status, r.ok ? "ok" : "bad");
    }
  } catch (e) {
    lastResponse = { status: 0, ok: false, doc: { error: String(e) } };
    setState("network error", "bad");
  } finally {
    if (btn) btn.disabled = false;
    renderIO(); renderIONav();
  }
}

// runStream reads Server-Sent Events by hand: EventSource can send neither a
// POST body nor an Authorization header.
async function runStream(id, body, started) {
  const r = await fetch(runPath(id), {
    method: "POST",
    headers: { authorization: "Bearer " + token, "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!r.ok && !String(r.headers.get("content-type")).includes("event-stream")) {
    const doc = await r.json().catch(() => ({}));
    lastResponse = { status: r.status, ok: false, doc };
    remember({ account: id, endpoint: runPath(id), ok: false, status: r.status,
      took: Date.now() - started, body, doc });
    setState("failed " + r.status, "bad");
    return;
  }
  setState("streaming…", "busy");
  const run = { id, endpoint: runPath(id), body, started, status: r.status, seq: 0, tries: 0 };
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = "";
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const chunks = buf.split("\n\n"); buf = chunks.pop();
    for (const chunk of chunks) {
      let name = "message", data = "";
      for (const line of chunk.split("\n")) {
        if (line.startsWith("event: ")) name = line.slice(7);
        else if (line.startsWith("data: ")) data += line.slice(6);
      }
      if (!data) continue;
      let doc = data;
      try { doc = JSON.parse(data); } catch {}
      runEvent(name, doc, run);
    }
  }
}

// runEvent shows one event of a run. Both transports carry the same events,
// so both must show them the same way: this is the only place that knows what
// an event means, and the socket and the stream only differ in how they get
// one here.
function runEvent(name, doc, run) {
  lastEvents.push({ name, doc });
  // The answer arrives mid-stream; the terminal event only says how the
  // run ended, so keep it here or it would be buried in the log.
  if (doc && typeof doc === "object") {
    if (typeof doc.result === "string" && doc.result) lastAnswer = doc.result;
    else if (doc.item && doc.item.type === "agent_message" && doc.item.text) lastAnswer = doc.item.text;
    // Where the stream got to, so a socket that has to reconnect can ask for
    // what it missed rather than for everything again.
    if (typeof doc.seq === "number") run.seq = doc.seq;
    if (doc.run_id) run.runID = doc.run_id;
  }
  if (name === "done" || name === "error") {
    run.ended = true;
    lastResponse = { status: run.status, ok: name === "done" && !doc.is_error, doc };
    remember({ account: doc.account || run.id, endpoint: run.endpoint, ok: name === "done",
      status: run.status, took: Date.now() - run.started, body: run.body, events: lastEvents.length,
      doc: Object.assign({ result: lastAnswer }, doc) });
    setState(name === "done" ? "done" : "failed", name === "done" ? "ok" : "bad");
    renderTalk();
  }
  if (ioTab === "response") renderIO();
}

/* ================================================================ socket == */
// A run with input on is opened over a WebSocket: one connection carrying the
// events out and messages, interrupts and the close back in. It is the same
// run the endpoints reach, and the same events the stream carries — the box
// under the output pane is the only thing this transport adds.
const wsPath = id => (id ? `/v1/accounts/${id}/ws` : "/v1/ws");

async function runSocket(id, body, started) {
  const run = { id, endpoint: wsPath(id), body, started, status: 101, seq: 0, tries: 0 };
  await openSocket(wsURL(wsPath(id)), run, sock =>
    // input and stream are what a socket is: the server forces both, and the
    // frame says so rather than leaving the form to be read two ways.
    sock.send(JSON.stringify(Object.assign({ type: "start" }, body, { input: true, stream: true }))));
}

// openSocket holds one connection until the run is over. A browser cannot put
// a header on a WebSocket, so a token travels as a subprotocol: the server
// checks it before the upgrade and echoes only "rota" back. A session needs
// none of that — the browser attaches the cookie itself — so a page that has
// signed in offers only "rota".
function openSocket(url, run, first) {
  return new Promise(resolve => {
    let sock;
    const protocols = token ? ["rota", "bearer." + token] : ["rota"];
    try { sock = new WebSocket(url, protocols); }
    catch (e) { setState("no socket: " + e, "bad"); resolve(); return; }
    run.sock = sock; live = run;
    sock.onopen = () => { setState("streaming…", "busy"); first(sock); renderTalk(); };
    sock.onmessage = e => {
      let doc;
      try { doc = JSON.parse(e.data); } catch { return; }
      // An ack answers one frame this page sent. Only a refused one is worth
      // saying: what became of an accepted message arrives as an event.
      if (doc && doc.type === "ack") {
        if (doc.error) setState(doc.error, "bad");
        return;
      }
      runEvent((doc && doc.type) || "message", doc, run);
    };
    sock.onerror = () => {};
    sock.onclose = () => {
      run.sock = null;
      // A close before the terminal event is a connection that broke, not a
      // run that ended: the run keeps going on the server for its grace
      // period, so ask for it again from where this one got to.
      if (!run.ended && run.runID && run.tries < 3) {
        run.tries++;
        setState("reconnecting…", "busy");
        setTimeout(() => openSocket(wsURL(`/v1/runs/${run.runID}/ws?since=${run.seq}`), run, () => {}).then(resolve),
          300 * run.tries);
        return;
      }
      if (!run.ended) setState("the socket closed", "bad");
      live = null; renderTalk();
      resolve();
    };
  });
}

// talk sends one frame into the open run, under a ref of its own so the ack
// that comes back can be matched to it.
function talk(frame) {
  if (!live || !live.sock) return setState("no run is open", "bad");
  live.refs = (live.refs || 0) + 1;
  frame.ref = "c" + live.refs;
  try { live.sock.send(JSON.stringify(frame)); }
  catch (e) { setState("the socket has gone", "bad"); }
}

// renderTalk is the box that talks back. It lives outside the output pane's
// own redraw, so an event arriving mid-sentence never destroys what is being
// typed, and it is there only while there is a run to say it to.
function renderTalk() {
  const host = $("#talk");
  if (!live || !live.sock || live.ended) { host.replaceChildren(); return; }
  if (host.children.length) return; // already up: leave what is typed alone
  const box = el("input", { type: "text", placeholder: "Say something to this run…", "aria-label": "Message" });
  const steer = el("input", { type: "checkbox", id: "steer" });
  const send = () => {
    const text = box.value.trim();
    if (!text) return;
    talk({ type: "message", text, steer: !!steer.checked });
    box.value = "";
  };
  box.addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); send(); } });
  host.replaceChildren(
    box,
    el("button", { class: "btn primary", text: "Send", onclick: send }),
    el("label", { class: "steer", for: "steer" }, [steer, el("span", { text: "Steer" })]),
    el("button", { class: "btn tiny", text: "Stop", title: "interrupt the tool it is running",
      onclick: () => talk({ type: "interrupt" }) }),
    el("button", { class: "btn tiny", text: "Close", title: "no more messages: it finishes its turn and exits",
      onclick: () => talk({ type: "close" }) }),
  );
  lock(host);
}

/* ============================================================== history == */
// remember keeps the whole exchange, not a summary of it: the body that was
// sent, the endpoint it went to and the response that came back. Reading an
// earlier run is the point of keeping them, and a truncated preview cannot
// answer "what did I actually send".
function remember(e) {
  const a = accounts.find(x => String(x.id) === String(e.account));
  const h = loadHistory();
  h.unshift({
    at: Date.now(),
    account: Number(e.account) || 0,
    provider: a ? a.provider : "",
    endpoint: e.endpoint,
    ok: e.ok, status: e.status, took: e.took,
    prompt: String(e.body.prompt || "").slice(0, 300),
    model: e.body.model || "",
    // The files' names, not their bytes: history is for reading back what
    // was asked, and a browser profile is not a place to keep uploads.
    body: Object.assign({}, e.body, e.body.files ? { files: e.body.files.map(f => ({ path: f.path })) } : {}),
    res: slim(e.doc),
    // Buffered runs can carry an event log too, and slim drops it; count it
    // here or the pane would not say it existed.
    events: e.events || (e.doc && Array.isArray(e.doc.events) ? e.doc.events.length : 0),
    answer: String((e.doc && (e.doc.result || e.doc.error)) || "").slice(0, 400),
  });
  saveHistory(h);
  renderIONav();
}

function restore(item) {
  values = Object.assign({}, item.body, { __account: item.account ? String(item.account) : "" });
  uploads = [];
  selected = null; // the form now holds it, so the live request is the truth
  view = "ask"; open.add("core"); filter = "";
  renderNav(); render();
  setState("loaded from history", "ok");
}

// look opens a past run in the output panes. It starts on Request because
// that is the question history is usually asked: what did that one send?
function look(item) {
  selected = item;
  ioTab = "request";
  renderIONav(); renderIO();
}

function renderHistory(host) {
  const h = loadHistory();
  if (!h.length) {
    host.append(el("div", { class: "empty" }, [
      el("b", { text: "No runs yet" }),
      el("span", { text: "Every run is kept here, in this browser only." }),
    ]));
    return;
  }
  host.append(el("div", { class: "hist" }, h.map(item => el("div", { class: "hist-item" + (item === selected ? " on" : "") }, [
    el("div", { class: "hist-top" }, [
      el("span", { class: "pill " + (item.ok ? "ok" : "bad"), text: item.ok ? "ok" : "failed " + item.status }),
      el("span", { text: `#${item.account} ${item.provider}` }),
      item.model ? el("span", { text: item.model }) : null,
      item.events ? el("span", { text: item.events + " events" }) : null,
      el("span", { class: "grow" }),
      el("span", { text: new Date(item.at).toLocaleTimeString() }),
      el("span", { text: ms(item.took) }),
    ]),
    el("div", { class: "hist-prompt", text: item.prompt || "(no prompt)" }),
    item.answer ? el("div", { class: "help", style: "margin:4px 0 0", text: item.answer.slice(0, 160) }) : null,
    el("div", { class: "hist-actions" }, [
      el("button", { class: "btn tiny", text: "View", title: "show this run's request and response",
        onclick: () => look(item) }),
      el("button", { class: "btn tiny", text: "Load", title: "put this request back into the form",
        onclick: () => restore(item) }),
      el("button", { class: "btn tiny", text: "Copy JSON",
        onclick: () => navigator.clipboard.writeText(JSON.stringify(item.body, null, 2)) }),
    ]),
  ]))));
  host.append(el("div", { style: "margin-top:12px" }, [
    el("button", { class: "btn tiny ghost", text: "Clear history",
      onclick: () => { saveHistory([]); renderIO(); renderIONav(); } }),
  ]));
}

/* =============================================================== output == */
function showResponse(doc, status, note) {
  lastResponse = { status, ok: status >= 200 && status < 300, doc, note };
  lastEvents = []; lastAnswer = "";
  selected = null; // something just happened; that is what to show
  ioTab = "response"; renderIONav(); renderIO();
}

// pastBanner marks the panes as showing something that already happened, and
// offers the way back. Without it a stored request is indistinguishable from
// the one about to be sent, which is worse than not showing it at all.
function pastBanner(item) {
  return el("div", { class: "banner" }, [
    el("span", { class: "pill " + (item.ok ? "ok" : "bad"), text: item.ok ? "ok" : "failed " + item.status }),
    el("span", { text: `from history · ${new Date(item.at).toLocaleTimeString()} · #${item.account} ${item.provider}` }),
    el("span", { class: "grow" }),
    el("button", { class: "btn tiny", text: "Show the live request",
      onclick: () => { selected = null; renderIO(); } }),
  ]);
}

// renderPast shows one stored run: exactly what was sent, and exactly what
// came back.
function renderPast(host, item) {
  host.append(pastBanner(item));
  if (ioTab === "request") {
    host.append(
      el("div", { class: "sect" }, [
        el("h4", { text: "Endpoint" }),
        el("pre", { class: "code", text: "POST " + (item.endpoint || `/v1/accounts/${item.account}/run`) }),
      ]),
      el("div", { class: "sect" }, [el("h4", { text: "Body" }), codeBlock(item.body || {})]),
    );
    return;
  }
  const doc = item.res;
  const answer = (doc && doc.result) || item.answer || "";
  if (answer) host.append(el("div", { class: "answer" }, [el("h4", { text: "Answer" }), el("div", { text: answer })]));
  const meta = el("div", { class: "meta" }, [
    el("span", { class: "pill " + (item.ok ? "ok" : "bad"), text: "HTTP " + item.status }),
    el("span", { class: "pill", text: "took " + ms(item.took) }),
    item.events ? el("span", { class: "pill", text: item.events + " events" }) : null,
  ]);
  host.append(meta);
  host.append(el("div", { class: "sect" }, [
    el("h4", { text: "Response" }),
    doc ? codeBlock(doc) : el("p", { class: "help", text: "This run was recorded before responses were kept." }),
  ]));
  if (item.events) {
    host.append(el("p", { class: "help", text: `The ${item.events} events this run produced are not kept: an event log can be very large, and a stored copy of one would be the biggest thing in this browser.` }));
  }
}

function renderIO() {
  const host = $("#io");
  host.replaceChildren();
  if (ioTab === "history") { renderHistory(host); return; }
  if (selected) { renderPast(host, selected); return; }
  if (ioTab === "request") {
    const id = values.__account;
    host.append(
      el("div", { class: "sect" }, [
        el("h4", { text: "Endpoint" }),
        // Plain text, not codeBlock: a path is not JSON, and colouring its
        // digits as numbers would be a lie about what it is.
        el("pre", { class: "code", text: `POST ${runPath(id)}` }),
      ]),
      el("div", { class: "sect" }, [
        el("h4", { text: "Body" }),
        codeBlock(buildBody()),
      ]),
    );
    return;
  }

  // Response.
  if (!lastResponse && !lastEvents.length) {
    host.append(el("div", { class: "empty" }, [
      el("b", { text: "Nothing yet" }),
      el("span", { text: "Run something, and the answer appears here." }),
    ]));
    return;
  }
  const doc = lastResponse ? lastResponse.doc : null;
  const answer = lastAnswer || (doc && typeof doc === "object" && doc.result) || "";
  if (answer) {
    host.append(el("div", { class: "answer" }, [el("h4", { text: "Answer" }), el("div", { text: answer })]));
  }
  if (doc && typeof doc === "object") {
    const meta = el("div", { class: "meta" });
    const add = (label, v) => { if (v !== undefined && v !== null && v !== "") meta.append(el("span", { class: "pill", text: `${label} ${v}` })); };
    if (lastResponse) meta.append(el("span", { class: "pill " + (lastResponse.ok ? "ok" : "bad"), text: "HTTP " + lastResponse.status }));
    add("account", doc.account);
    add("provider", doc.provider);
    add("model", doc.model);
    add("effort", doc.effort);
    add("exit", doc.exit_code);
    if (doc.cost_usd) add("cost", "$" + Number(doc.cost_usd).toFixed(4));
    if (doc.duration_ms) add("took", ms(doc.duration_ms));
    add("session", doc.session_id);
    if (meta.children.length) host.append(meta);
    if (doc.error) host.append(el("div", { class: "sect" }, [el("h4", { text: "Error" }), codeBlock(doc)]));
    const shown = answerSection(doc);
    if (shown) host.append(shown);
    const asked = askSection(doc);
    if (asked) host.append(asked);
  }
  if (lastEvents.length) {
    host.append(el("div", { class: "sect" }, [
      el("h4", { text: `${lastEvents.length} events` }),
      ...lastEvents.map(ev => el("div", { class: "ev " + ev.name }, [
        el("div", { class: "ev-name", text: ev.name }),
        codeBlock(ev.doc),
      ])),
    ]));
  } else if (doc) {
    host.append(el("div", { class: "sect" }, [el("h4", { text: "Response" }), codeBlock(doc)]));
  }
}

/* ================================================================ shell == */
// answerSection shows the reply the way it was written: prose as prose,
// code as code. rota already split it, so the page does not have to know
// what markdown is either.
function answerSection(doc) {
  if (!doc || !(doc.blocks || []).length) return null;
  return el("div", { class: "sect" }, [
    el("h4", { text: "Answer" }),
    el("div", { class: "answer" }, doc.blocks.map(b => b.kind === "code"
      ? el("pre", { class: "code", text: b.text })
      : el("p", { text: b.text }))),
  ]);
}

// askSection shows a run that ended by asking something. The choices are
// shown but not clickable: a headless run has already exited, and there is
// nowhere to send an answer except a new run.
function askSection(doc) {
  if (!doc || !doc.ask) return null;
  const ask = doc.ask;
  const kids = [el("h4", { text: "It ended by asking" }), el("p", { class: "asked", text: ask.question })];
  if ((ask.options || []).length) {
    kids.push(el("ul", { class: "opts" }, ask.options.map(o => el("li", {}, [
      el("input", { type: ask.multiple ? "checkbox" : "radio", name: "ask-opt", disabled: true }),
      el("span", { text: o }),
    ]))));
    if (ask.multiple) kids.push(el("p", { class: "help", text: "Written as a task list, so more than one may be taken." }));
  }
  kids.push(el("p", { class: "help", text: "Read from the wording of the answer, not sent by the CLI — a headless run has no structured question, and no way to be answered in place. Reply by running again with resume." }));
  return el("div", { class: "sect asking" }, kids);
}

// renderFoot is separate from render because the footer changes on every
// keystroke — the target account, whether the run will stream — and
// rebuilding the whole form for that would lose focus mid-word.
function renderFoot() {
  if (view !== "ask") return;
  const who = accounts.find(x => String(x.id) === (values.__account || String(defaultAccount)));
  $("#foot").replaceChildren(
    el("button", { class: "btn primary", text: "▶  Run", onclick: doRun, disabled: watching() }),
    el("span", { class: "pill", text: values.stream ? "streaming" : "buffered" }),
    el("span", { class: "pill", title: values.__account ? "the account you named" : "the rotation's current choice",
      text: who ? `→ #${who.id} ${who.provider}${who.metered ? "  " + Math.round(who.percent) + "%" : ""}` : "no account available" }),
    el("span", { class: "grow" }),
    el("span", { class: "help", style: "margin:0", text: "⌘/Ctrl + Enter" }),
  );
}

// renderPanel redraws the main column only. render also redraws the footer
// and the output, which is what a change of section needs.
function renderPanel() {
  const panel = $("#panel");
  panel.replaceChildren();
  if (!schema) {
    viewGate(panel);
    return;
  }
  if (watching()) panel.append(watchNote());
  ({ ask: viewAsk, accounts: viewAccounts, running: viewRunning, signin: viewSignIn, console: viewConsole }[view] || viewAsk)(panel);
}

function render() {
  $("#foot").replaceChildren();
  renderPanel();
  renderFoot();
  renderIO();
}

/* ================================================================= boot == */
document.addEventListener("keydown", e => {
  if (!schema) return;
  if ((e.metaKey || e.ctrlKey) && e.key === "Enter" && view === "ask") { e.preventDefault(); doRun(); return; }
  // Bare digits jump between sections, but not while something is being
  // typed into — a "2" belongs in the field, not in the navigation.
  const tag = e.target && e.target.tagName;
  if (e.metaKey || e.ctrlKey || e.altKey || tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
  const hit = VIEWS.find(v => v[2] === e.key);
  if (hit) { view = hit[0]; renderNav(); render(); }
});

// What the shared page asks of whichever page it is on.
showRefusal = showResponse;
onReady = () => { renderNav(); render(); };
onSignedOut = () => { live = null; renderNav(); render(); };

renderNav();
renderIONav();
render();
pageBoot("playground");
</script>
