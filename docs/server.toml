# rota server.toml — one file for running the server and for the routes it
# answers. Every key below is written with the value rota uses when it is
# left out, so this file changes nothing: copy it to $ROTA_HOME/server.toml
# (or ~/.rota/server.toml) and edit what you mean.
#
# A flag beats the environment, the environment beats this file, and this
# file beats the defaults printed here. `rota serve --print-config` says
# where each value in the end came from.
#
# This file may hold the bearer token and the derived passwords of everyone
# who may sign in, so rota refuses to start if anyone but its owner can read
# it: chmod 600 server.toml.
#
# rota has no database. What persists is the store directory, [store] below.

[server]
listen = "127.0.0.1:8787"  # host:port, or a bare port for every interface
quiet = false              # log warnings and errors only

[tls]
cert = ""  # the certificate; without it the token travels in clear text
key = ""   # the private key; cert and key go together or not at all

[auth]
token = ""                # the bearer token, if you keep it here
token_file = ""           # or a file holding it, under the same permission rule
token_env = "ROTA_TOKEN"  # or the name of the variable that holds it
session_ttl = "12h"       # how long a sign-in on the page lasts

# Whole groups of routes, on or off. A group that is off is not registered,
# so its paths answer 404 like any path this server never had.
[routes]
api = true         # everything under /v1 except the sockets and /v1/health
playground = true  # GET /, GET /playground and the invite landing
websocket = true   # the /ws routes, which carry a run that stays open
health = true      # GET /v1/health, open and depending on nothing
terminal = false   # the /v1/terminals routes; needs api and websocket

# A terminal is an account's CLI on a pseudo-terminal that lives in this
# server: it outlives the browser tab that opened it, several people may
# watch it, and one of them at a time holds the keyboard. It is off above
# because a control sign-in on it runs commands on this machine as the user
# the server runs as — which is also why rota refuses to start with it on, a
# listen address that is not the loopback, and no certificate. It runs on
# linux and macOS.
[terminal]
shell = false               # also allow a plain login shell, not only accounts' CLIs
max_sessions = 8            # terminals running at once
scrollback_bytes = 2097152  # output kept per terminal, for whoever attaches
idle_timeout = "12h"        # a terminal nobody is attached to ends after this long
record = false              # keep each terminal's output under <store>/terminals/
record_max_bytes = 52428800 # how much of one terminal is kept; input never is

[runs]
timeout = "10m"          # hard cap on one run
max_concurrent = 8       # how many CLIs may run at once
input_timeout = "1h"     # hard cap on a run that stays open for more messages
input_grace = "1m"       # how long an open run survives with nobody reading it
replay = 1000            # events an open run keeps for a reader that reattaches
refresh_every = "2m"     # how often to rotate tokens and re-read usage; "0s" is off
roots = []               # confine cwd, uploads and extra directories here
allow_dangerous = false  # permit permission-bypass and full-access options
allow_raw_flags = false  # let callers pass flags straight to the vendor CLI

[store]
dir = ""  # where rota keeps everything; empty is $ROTA_HOME or ~/.rota

# Who may sign in on the page, and what they may do. There are two roles:
# "control" may do everything this server does, which includes running a
# coding agent on this machine; "watch" may read everything and change
# nothing. rota never writes this file — make a block with
#
#   rota serve passwd alice --role control
#
# which asks for the password twice without echoing it and prints:
#
#   [[users]]
#   name     = "alice"
#   role     = "control"
#   password = "pbkdf2-sha256$600000$<salt>$<hash>"

# Bearer tokens besides the one above, each with a role: a CI job that reads
# the accounts and never runs anything is a watch token. Only the SHA-256 is
# written down, so this file gives a reader nothing to send. Make one with
#
#   rota serve token ci-watch --role watch
#
# which prints the token once and:
#
#   [[tokens]]
#   name   = "ci-watch"
#   role   = "watch"
#   sha256 = "<64 hexadecimal characters>"
