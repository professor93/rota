name: ci

on:
  push:
    branches: [main]
  pull_request:
  # By hand on a branch, so Windows is proven before a tag.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      # The playground's script is tested by running it in node.
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: format
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      # The program is a module of its own, which ./... at the root leaves out.
      - name: vet the program
        run: go -C cmd/rota vet ./...
      - name: test
        run: go test ./...
      - name: test the program
        run: go -C cmd/rota test ./...
      - name: module boundary
        run: sh scripts/module.sh check

  # The same suite on Windows. The fake vendor CLIs are the test binary
  # itself (internal/fakecli), so nothing here needs a shell.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: build
        run: go build ./...
      - name: build the program
        run: go -C cmd/rota build ./...
      - name: vet
        run: go vet ./...
      - name: vet the program
        run: go -C cmd/rota vet ./...
      - name: test
        run: go test ./...
      - name: test the program
        run: go -C cmd/rota test ./...
