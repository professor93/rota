name: release

on:
  push:
    # vX.Y.Z is the root and the binaries; cmd/rota/vX.Y.Z, pushed after it, is the program's module.
    tags: ['v*', 'cmd/rota/v*']
  # By hand, against a tag that already exists: runs only the checks of
  # what was shipped, never a publish.
  workflow_dispatch:
    inputs:
      tag:
        description: 'released tag to check, like v1.0.5'
        required: true

permissions:
  contents: write

jobs:
  # The consumer suite runs against this exact commit before anything is
  # published: a release the SDK's own users' tests refuse never ships.
  gate:
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'cmd/rota/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          path: rota
      - uses: actions/checkout@v5
        with:
          repository: professor93/rota-sdk-test
          path: rota-sdk-test
      - uses: actions/setup-go@v6
        with:
          go-version-file: rota/go.mod
          cache: false
      - uses: actions/setup-node@v5
        with:
          node-version: 26
      - name: rota's own tests
        working-directory: rota
        run: |
          go vet ./...
          go -C cmd/rota vet ./...
          go test ./...
          go -C cmd/rota test ./...
          sh scripts/module.sh check
      - name: the program the suite runs
        working-directory: rota
        run: go build -o "$RUNNER_TEMP/rota" ./cmd/rota
      # As JSON, so each result names its package: a suite whose serve tests
      # all skip proves nothing of serve, and fails here.
      - name: consumer suite against this commit
        working-directory: rota-sdk-test
        run: |
          go work init . ../rota
          go vet ./...
          serve="$(go list ./serve)"
          rc=0
          ROTA_BIN="$RUNNER_TEMP/rota" go test -json ./... >"$RUNNER_TEMP/suite.json" || rc=$?
          jq -rj 'select(.Action == "output" or .Action == "build-output") | .Output' "$RUNNER_TEMP/suite.json"
          test "$rc" -eq 0
          n="$(jq -s --arg p "$serve" '[.[] | select(.Action == "pass" and .Test != null and (.Package == $p or (.Package | startswith($p + "/"))))] | length' "$RUNNER_TEMP/suite.json")"
          echo "serve tests passed: $n"
          test "$n" -gt 0 || { echo "no test in $serve passed: the gate needs one"; exit 1; }

  publish:
    if: github.event_name == 'push' && !startsWith(github.ref_name, 'cmd/rota/')
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false
      - name: version matches the tag
        run: |
          want="${GITHUB_REF_NAME#v}"
          got="$(go run ./cmd/rota --version | awk '{print $2}')"
          test "$got" = "$want" || { echo "binary says $got, tag says $want"; exit 1; }
      - name: build
        run: sh scripts/release.sh
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A tag with a pre-release part, like v1.4.0-beta.1, is published as a
        # pre-release, so releases/latest, which install.sh reads, keeps
        # pointing at the last stable version.
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "rota ${GITHUB_REF_NAME#v}" --notes "rota ${GITHUB_REF_NAME#v}" dist/*

  # What shipped, run where it will run: each binary is downloaded from the
  # release on its own platform and asked to report its version, list an
  # empty home, and serve its root.
  smoke:
    needs: publish
    if: always() && (needs.publish.result == 'success' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: rota-linux-amd64
          - os: macos-latest
            asset: rota-darwin-arm64
          - os: windows-latest
            asset: rota-windows-amd64.exe
    runs-on: ${{ matrix.os }}
    env:
      REF: ${{ inputs.tag || github.ref_name }}
      ASSET: ${{ matrix.asset }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # By hand, either tag of a release names its binaries: cmd/rota/vX.Y.Z
      # is checked as vX.Y.Z, which the steps after this one read as TAG.
      - name: tag is a release tag
        shell: bash
        run: |
          v="${REF#cmd/rota/}"
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "$REF is not a release tag, like v1.0.5 or cmd/rota/v1.0.5"; exit 1; }
          echo "TAG=$v" >>"$GITHUB_ENV"
      - name: download
        shell: bash
        run: gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p "$ASSET" -p checksums.txt -D bin
      - name: checksum
        shell: bash
        run: |
          cd bin
          want="$(grep " $ASSET\$" checksums.txt | cut -d' ' -f1)"
          if command -v sha256sum >/dev/null; then got="$(sha256sum "$ASSET" | cut -d' ' -f1)"; else got="$(shasum -a 256 "$ASSET" | cut -d' ' -f1)"; fi
          test -n "$want" && test "$got" = "$want" || { echo "checksum: want $want got $got"; exit 1; }
      - name: runs
        if: runner.os != 'Windows'
        shell: bash
        run: |
          chmod +x "bin/$ASSET"
          export ROTA_HOME="$RUNNER_TEMP/home"
          "bin/$ASSET" --version | grep -qx "rota ${TAG#v}"
          "bin/$ASSET" list | grep -q "No accounts yet"
          "bin/$ASSET" serve 127.0.0.1:8787 --token smoke --refresh-every 0 &
          for i in $(seq 1 50); do curl -fsS http://127.0.0.1:8787/ >root.json 2>/dev/null && break; sleep 0.2; done
          kill %1
          grep -q "\"version\":\"${TAG#v}\"" root.json
      - name: runs
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:ROTA_HOME = Join-Path $env:RUNNER_TEMP 'home'
          $bin = Join-Path 'bin' $env:ASSET
          $v = & $bin --version
          if ($v -ne "rota $($env:TAG.TrimStart('v'))") { throw "version: $v" }
          $l = & $bin list | Out-String
          if ($l -notmatch 'No accounts yet') { throw "list: $l" }
          $p = Start-Process -FilePath $bin -ArgumentList 'serve','127.0.0.1:8787','--token','smoke','--refresh-every','0' -PassThru
          $root = $null
          for ($i = 0; $i -lt 50 -and -not $root; $i++) { try { $root = (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8787/).Content } catch { Start-Sleep -Milliseconds 200 } }
          Stop-Process -Id $p.Id -Force
          if ($root -notmatch ('"version":"' + $env:TAG.TrimStart('v') + '"')) { throw "root: $root" }

  # The program's module as the world fetches it, by its own tag; by hand, the root's tag, and versions before the split resolve to the root.
  module:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'cmd/rota/')
    runs-on: ubuntu-latest
    # Most of it is the wait for the root's release run.
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
      - name: tag is a release tag
        run: |
          v="${TAG#cmd/rota/}"
          echo "$v" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || { echo "$TAG is not a release tag, like v1.0.5 or cmd/rota/v1.0.5"; exit 1; }
      # cmd/rota/vX.Y.Z is pushed after vX.Y.Z, so it runs apart and cannot
      # need that run's gate: it waits for the whole run, gate to smoke, and
      # is proven only once it is green.
      - name: the root's release run is green
        if: github.event_name == 'push'
        run: |
          v="${TAG#cmd/rota/}"
          id=""
          for i in $(seq 1 30); do
            id="$(gh run list -R "$GITHUB_REPOSITORY" -w release.yml -e push -b "$v" -L 1 --json databaseId -q '.[0].databaseId')"
            test -n "$id" && break
            sleep 10
          done
          test -n "$id" || { echo "no release run for $v"; exit 1; }
          while :; do
            state="$(gh run view "$id" -R "$GITHUB_REPOSITORY" --json status,conclusion -q '.status + " " + .conclusion')"
            case "$state" in completed*) break ;; esac
            sleep 30
          done
          test "$state" = "completed success" || { echo "the release run of $v ended ${state#completed }: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$id"; exit 1; }
      # The proxy alone, with no direct fallback, so what passes is what
      # proxy.golang.org serves. It fetches a new version on the first
      # request for it; the retries cover a proxy slow to have it.
      - name: go install through the proxy
        env:
          GOPROXY: https://proxy.golang.org
          GOFLAGS: -mod=mod
        run: |
          v="${TAG#cmd/rota/}"
          for i in 1 2 3 4 5; do
            go install "github.com/professor93/rota/cmd/rota@$v" && break
            test "$i" -lt 5 || exit 1
            sleep 30
          done
          "$(go env GOPATH)/bin/rota" --version | grep -qx "rota ${v#v}"
